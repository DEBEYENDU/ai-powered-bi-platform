version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Vite majors must move together (vite + plugin-react + vitest share peer
    # ranges); single-package bumps fail `npm ci` with ERESOLVE. Group them.
    groups:
      vite-stack:
        patterns: ["vite", "@vitejs/*", "vitest"]
  - package-ecosystem: docker
    directory: /infra/docker
    schedule: { interval: weekly }
    # Pin Python to stable 3.13 line; 3.14 is pre-release and not yet
    # suitable for production base images.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }

# Production delivery.
#
# Same honesty contract as staging: image build+push and manifest rendering run
# on every tag (genuine). The cluster deploy is manual (`workflow_dispatch`)
# behind the protected `production` environment (required reviewers in repo
# settings) plus PROD_KUBECONFIG / PROD_JWT_SECRET secrets. Smoke failures
# trigger an automatic helm rollback.
name: CD Production
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: cd-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  push-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { packages: write, contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # metadata-action lowercases the owner (GHCR requires lowercase repo
      # names; github.repository_owner preserves case like DEBEYENDU).
      - uses: docker/metadata-action@v6
        id: meta-backend
        with:
          images: ghcr.io/${{ github.repository_owner }}/bi-backend
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/metadata-action@v6
        id: meta-frontend
        with:
          images: ghcr.io/${{ github.repository_owner }}/bi-frontend
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/backend.prod.Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/frontend.prod.Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}

  render-manifests:
    needs: [push-images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm dependency update ./infra/helm/bi-platform
      - run: helm template bi-platform ./infra/helm/bi-platform
          -f ./infra/helm/bi-platform/values-prod.yaml
          --set images.backend.tag=${{ env.TAG }}
          --set images.frontend.tag=${{ env.TAG }}
          --set secrets.jwtSecretKey=dummy-ci-value
          --set dbUrlOverride=x --set redisUrlOverride=y
          --validate > /dev/null

  deploy:
    needs: [push-images, render-manifests]
    # Manual only, until a production cluster exists.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: https://bi.example.com
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm dependency update ./infra/helm/bi-platform
      - run: echo "${{ secrets.PROD_KUBECONFIG }}" > /tmp/kubeconfig && chmod 600 /tmp/kubeconfig
      - run: helm upgrade --install bi-platform ./infra/helm/bi-platform
          -f ./infra/helm/bi-platform/values-prod.yaml
          --set images.backend.tag=${{ env.TAG }}
          --set images.frontend.tag=${{ env.TAG }}
          --set secrets.jwtSecretKey=${{ secrets.PROD_JWT_SECRET }}
          --namespace bi-platform --create-namespace
        env: { KUBECONFIG: /tmp/kubeconfig }
      - run: kubectl -n bi-platform rollout status deploy/bi-platform-api --timeout=600s
        env: { KUBECONFIG: /tmp/kubeconfig }

  smoke:
    needs: [deploy]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: python3 infra/scripts/smoke_test.py
        env: { API_BASE_URL: https://bi.example.com }

  rollback-on-failure:
    needs: [smoke]
    if: failure() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: echo "${{ secrets.PROD_KUBECONFIG }}" > /tmp/kubeconfig && chmod 600 /tmp/kubeconfig
      - run: helm rollback bi-platform -n bi-platform
        env: { KUBECONFIG: /tmp/kubeconfig }

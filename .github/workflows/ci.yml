name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads code (no pushes, no deploys here).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      # Enforcing: backend must be ruff-clean (see backend/pyproject.toml).
      - run: ruff check backend/app
      - run: ruff format --check backend/app

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install mypy sqlalchemy
      # Gated scope = files listed under [tool.mypy] (foundation layer, clean).
      # Feature modules are onboarded incrementally; see pyproject + audit doc.
      - run: mypy
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pydantic pytest pytest-asyncio httpx
      - run: PYTHONPATH=backend python -m pytest backend/app/ai/tests backend/app/admin/tests backend/app/reports/tests -q

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bi
          POSTGRES_PASSWORD: bi
          POSTGRES_DB: bi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bi"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r backend/requirements.txt
      - run: pip install pytest pytest-asyncio httpx
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://bi:bi@localhost:5432/bi_test
      # Boot smoke: catches broken router/wiring imports (app must assemble).
      - run: PYTHONPATH=backend python -c "from app.main import app; print('paths:', len(app.openapi()['paths']))"
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://bi:bi@localhost:5432/bi_test
      - run: PYTHONPATH=backend python -m pytest backend/app -q
        env:
          DATABASE_URL: postgresql+psycopg://bi:bi@localhost:5432/bi_test
          REDIS_URL: redis://localhost:6379/0

  build:
    needs: [lint, unit-test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm dependency update ./infra/helm/bi-platform
      - run: helm lint ./infra/helm/bi-platform
      - run: helm template bi-test ./infra/helm/bi-platform --values ./infra/helm/bi-platform/values-prod.yaml --set dbUrlOverride=x --set redisUrlOverride=y > /dev/null
      - run: docker build -f infra/docker/backend.prod.Dockerfile -t bi-backend:ci .
      - run: docker build -f infra/docker/frontend.prod.Dockerfile -t bi-frontend:ci .

name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - run: ruff check backend/app || true
      - run: ruff format --check backend/app || true

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pydantic pytest pytest-asyncio httpx
      - run: PYTHONPATH=backend python -m pytest backend/app/admin/tests backend/app/reports/tests -q

  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bi
          POSTGRES_PASSWORD: bi
          POSTGRES_DB: bi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bi"
          --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r backend/requirements.txt
      - run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://bi:bi@localhost:5432/bi_test
      - run: PYTHONPATH=backend python -m pytest backend/app -q -x --ignore=backend/app/ai/tests

  build:
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint ./infra/helm/bi-platform
      - run: helm template bi-test ./infra/helm/bi-platform --values ./infra/helm/bi-platform/values-prod.yaml --set dbUrlOverride=x --set redisUrlOverride=y > /dev/null
      - run: docker build -f infra/docker/backend.prod.Dockerfile -t bi-backend:ci .
      - run: docker build -f infra/docker/frontend.prod.Dockerfile -t bi-frontend:ci .

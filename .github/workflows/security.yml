name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule: [{ cron: "0 6 * * 1" }]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt || true
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm audit --audit-level=high
        working-directory: frontend

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      # Build the actual production image from the current commit.
      - run: docker build -f infra/docker/backend.prod.Dockerfile -t bi-backend:scan .
      # SARIF upload for GitHub Security tab — non-blocking.
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: bi-backend:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: trivy-results.sarif }
      # Text report in CI logs — non-blocking.
      - uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: bi-backend:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

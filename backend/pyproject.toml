[tool.poetry]
name = "ai-powered-bi-platform"
version = "0.1.0"
description = "AI-Powered Business Intelligence and Analytics Platform"
authors = ["BI Platform Team"]
readme = "README.md"
packages = [{ include = "app", from = "." }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.30" }
gunicorn = ">=22.0"
pydantic = ">=2.7"
pydantic-settings = ">=2.4"
sqlalchemy = ">=2.0"
alembic = ">=1.13"
psycopg = { extras = ["binary"], version = ">=3.1" }
redis = ">=5.0"
celery = ">=5.4"
python-jose = ">=3.3"
passlib = { extras = ["bcrypt"], version = ">=1.7" }
python-multipart = ">=0.0.9"
structlog = ">=24.1"
jinja2 = ">=3.1"
reportlab = { version = ">=4.0", optional = true }
python-docx = { version = ">=1.1", optional = true }
openpyxl = { version = ">=3.1", optional = true }
python-pptx = { version = ">=0.6", optional = true }

[tool.poetry.extras]
documents = ["reportlab", "python-docx", "openpyxl", "python-pptx"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
httpx = ">=0.27"
ruff = ">=0.4"

[tool.pytest.ini_options]
testpaths = ["app"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

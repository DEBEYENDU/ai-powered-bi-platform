[tool.poetry]
name = "ai-powered-bi-platform"
version = "0.1.0"
description = "AI-Powered Business Intelligence and Analytics Platform"
authors = ["BI Platform Team"]
readme = "README.md"
packages = [{ include = "app", from = "." }]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.30" }
gunicorn = ">=22.0"
pydantic = ">=2.7"
pydantic-settings = ">=2.4"
email-validator = ">=2.0"
sqlalchemy = ">=2.0"
alembic = ">=1.13"
psycopg = { extras = ["binary"], version = ">=3.1" }
redis = ">=5.0"
celery = ">=5.4"
python-jose = ">=3.3"
passlib = { extras = ["bcrypt"], version = ">=1.7" }
python-multipart = ">=0.0.9"
structlog = ">=24.1"
jinja2 = ">=3.1"
aiofiles = ">=23.0"
chardet = ">=5.0"
reportlab = { version = ">=4.0", optional = true }
python-docx = { version = ">=1.1", optional = true }
openpyxl = { version = ">=3.1", optional = true }
python-pptx = { version = ">=0.6", optional = true }

[tool.poetry.extras]
documents = ["reportlab", "python-docx", "openpyxl", "python-pptx"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
httpx = ">=0.27"
ruff = ">=0.4"

[tool.pytest.ini_options]
testpaths = ["app"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
# `app/` is a PEP 420 namespace package (no __init__.py); these flags let mypy
# resolve `app.*` imports to a single module identity.
namespace_packages = true
explicit_package_bases = true
# Incremental adoption: only the `files` list below is checked; dependencies
# outside it are treated as untyped until those modules are onboarded.
follow_imports = "skip"
# Strictness is introduced incrementally: the foundation layer below is fully
# typed; feature modules (iam/dataset/etl/analytics/ai/reports/admin) follow.
files = [
  "app/core",
  "app/db",
  "app/exceptions",
  "app/dependencies",
  "app/middleware",
  "app/repositories",
  "app/services",
  "app/cache",
  "app/api",
  "app/main.py",
  "app/workers",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "S", "RUF", "DTZ", "BLE"]
ignore = [
  # FastAPI Depends()/Body()/Query() in defaults is the framework idiom.
  "B008",
  # Project-wide naive-UTC convention (datetime.utcnow); SQLite-compatible,
  # consistent across all modules. Do not mix tz-aware datetimes.
  "DTZ001",
  "DTZ003",
  # Pydantic v2 handles mutable class defaults safely.
  "RUF012",
  # str+Enum mixins preserve legacy str(member) output used in logs and
  # SQLAlchemy enum storage; StrEnum would change str() semantics.
  "UP042",
  # Generic[T] subclassing is valid and version-agnostic; PEP 695 syntax
  # adds churn without benefit.
  "UP046",
]
[tool.ruff.lint.per-file-ignores]
# Asserts are the test mechanism; stub placeholder literals are not secrets.
"app/**/tests/*.py" = ["S101", "S106"]
# Never-raise probes, event fan-out, degraded-mode fallbacks, retry loops:
# broad catching is the documented design in these files.
"app/admin/services/health.py" = ["BLE001"]
"app/admin/services/alerts.py" = ["BLE001"]
"app/admin/services/notifications.py" = ["BLE001"]
"app/admin/services/metrics.py" = ["BLE001"]
"app/admin/services/jobs.py" = ["BLE001"]
"app/admin/middleware/maintenance.py" = ["BLE001"]
"app/admin/routers/admin.py" = ["BLE001"]
"app/reports/events/events.py" = ["BLE001"]
"app/reports/generators/builder.py" = ["BLE001"]
"app/reports/distributions/distribution.py" = ["BLE001"]
"app/reports/exporters/exporters.py" = ["BLE001"]
"app/reports/jobs/tasks.py" = ["BLE001"]
"app/reports/schedulers/scheduler.py" = ["BLE001"]
"app/cache/service.py" = ["BLE001"]
"app/db/session.py" = ["BLE001"]
"app/dependencies/deps.py" = ["BLE001"]
"app/main.py" = ["BLE001"]
"app/ai/orchestrator/orchestrator.py" = ["BLE001"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

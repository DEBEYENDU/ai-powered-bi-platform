# Development: hot-reload API, Vite served locally (npm run dev), debug tooling.
# Usage: docker compose -f infra/compose/dev.yml --env-file backend/.env up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bi
      POSTGRES_PASSWORD: bi
      POSTGRES_DB: bi_platform
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: ../..
      dockerfile: infra/docker/backend.dev.Dockerfile
    depends_on: [db, redis]
    environment:
      DATABASE_URL: postgresql+psycopg://bi:bi@db:5432/bi_platform
      REDIS_URL: redis://redis:6379/0
      APP_DEBUG: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me}
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes: ["../../backend/app:/code/app"]

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/backend.dev.Dockerfile
    depends_on: [redis, db]
    environment:
      DATABASE_URL: postgresql+psycopg://bi:bi@db:5432/bi_platform
      REDIS_URL: redis://redis:6379/0
    command: celery -A app.workers.celery_app worker --loglevel=debug
    volumes: ["../../backend/app:/code/app"]

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["5050:80"]
    profiles: ["tools"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    profiles: ["tools"]

volumes:
  pgdata:

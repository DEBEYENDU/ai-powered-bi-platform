# Production: HA-ready single-host layout (multi-host HA via Kubernetes/Helm).
# Secrets REQUIRED: POSTGRES_PASSWORD, REDIS_PASSWORD, JWT_SECRET_KEY.
# Usage: REGISTRY=ghcr.io/<org> TAG=v1.0.0 ... docker compose -f infra/compose/prod.yml up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bi_platform
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bi}"]
      interval: 10s
      retries: 10
    logging: { driver: json-file, options: { max-size: 50m, max-file: "5" } }

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD} --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 10
    logging: { driver: json-file, options: { max-size: 50m, max-file: "5" } }

  api:
    image: ${REGISTRY:?set REGISTRY}/backend:${TAG:?set TAG}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bi}:${POSTGRES_PASSWORD}@db:5432/bi_platform
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      APP_ENV: production
    deploy:
      replicas: 3
      update_config: { parallelism: 1, order: start-first }
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { cpus: "0.5", memory: 512M }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      retries: 3
    logging: { driver: json-file, options: { max-size: 100m, max-file: "5" } }

  worker:
    image: ${REGISTRY}/backend:${TAG}
    depends_on: [redis, db]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bi}:${POSTGRES_PASSWORD}@db:5432/bi_platform
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2.0", memory: 4G }

  scheduler:
    image: ${REGISTRY}/backend:${TAG}
    depends_on: [redis, db]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bi}:${POSTGRES_PASSWORD}@db:5432/bi_platform
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    command: celery -A app.workers.celery_app beat --loglevel=info
    deploy: { replicas: 1 }

  frontend:
    image: ${REGISTRY}/frontend:${TAG}
    deploy: { replicas: 2 }

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api, frontend]
    ports: ["80:80", "443:443"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/nginx/certs:ro

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
    volumes:
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  redisdata:
  grafanadata:
  certs:

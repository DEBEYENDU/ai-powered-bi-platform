# Staging: production images, single replica, self-signed-friendly TLS via nginx.
# Usage: REGISTRY=ghcr.io/<org> JWT_SECRET_KEY=... docker compose -f infra/compose/staging.yml up -d
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: bi_staging
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bi}"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 10s
      retries: 10

  api:
    image: ${REGISTRY:-bi-platform}/backend:${TAG:-staging}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bi}:${POSTGRES_PASSWORD}@db:5432/bi_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      APP_ENV: staging
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "1.0", memory: 1G }
        reservations: { memory: 512M }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      retries: 3

  worker:
    image: ${REGISTRY:-bi-platform}/backend:${TAG:-staging}
    depends_on: [redis, db]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bi}:${POSTGRES_PASSWORD}@db:5432/bi_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    deploy: { replicas: 1 }

  scheduler:
    image: ${REGISTRY:-bi-platform}/backend:${TAG:-staging}
    depends_on: [redis, db]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bi}:${POSTGRES_PASSWORD}@db:5432/bi_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
    command: celery -A app.workers.celery_app beat --loglevel=info
    deploy: { replicas: 1 }

  frontend:
    image: ${REGISTRY:-bi-platform}/frontend:${TAG:-staging}
    ports: ["8080:8080"]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [api, frontend]
    ports: ["80:80", "443:443"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/nginx/certs:ro

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:
  grafanadata:
  certs:

# Non-secret config + secret skeleton (override via --set / external secrets).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  APP_ENV: {{ .Values.global.environment | quote }}
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
type: Opaque
stringData:
  postgresPassword: {{ .Values.secrets.postgresPassword | quote }}
  redisPassword: {{ .Values.secrets.redisPassword | quote }}
  jwtSecretKey: {{ .Values.secrets.jwtSecretKey | quote }}

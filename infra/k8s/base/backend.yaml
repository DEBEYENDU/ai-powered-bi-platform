# FastAPI backend: Deployment + Service + HPA + PDB.
# Rolling updates with start-first via maxSurge; graceful shutdown via
# gunicorn --graceful-timeout + terminationGracePeriodSeconds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bi-platform
  labels: { app: api }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/admin/metrics/prometheus"
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 60
      containers:
        - name: api
          image: ghcr.io/ORG/bi-backend:TAG
          ports: [{ containerPort: 8000 }]
          envFrom: [{ configMapRef: { name: bi-config } }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: bi-secrets, key: POSTGRES_PASSWORD } }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: bi-secrets, key: REDIS_PASSWORD } }
            - name: JWT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: bi-secrets, key: JWT_SECRET_KEY } }
            - name: DATABASE_URL
              value: postgresql+psycopg://bi:$(POSTGRES_PASSWORD)@postgres:5432/bi_platform
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379/0
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bi-platform
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: bi-platform
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 75 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: bi-platform
spec:
  minAvailable: 2
  selector: { matchLabels: { app: api } }

# PostgreSQL (pgvector) StatefulSet + Service.
# Production HA: replace with managed DB (RDS/Cloud SQL — see infra/terraform)
# or a Postgres operator; this manifest targets self-hosted/single-AZ.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bi-platform
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bi-platform
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      securityContext: { runAsUser: 999, fsGroup: 999 }
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{ containerPort: 5432 }]
          env:
            - name: POSTGRES_USER
              value: bi
            - name: POSTGRES_DB
              value: bi_platform
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: bi-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 4Gi }
          readinessProbe:
            exec: { command: [pg_isready, -U, bi] }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: [pg_isready, -U, bi] }
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 50Gi } }

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bi-api
    metrics_path: /admin/metrics/prometheus
    static_configs:
      - targets: ["api:8000"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "bi_.*"
        action: keep

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:6379"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

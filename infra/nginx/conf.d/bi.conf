# Upstream routing: /api + /admin + /health -> backend, / -> frontend SPA.
upstream api {
  least_conn;
  server api:8000 max_fails=3 fail_timeout=30s;
  keepalive 32;
}

upstream frontend {
  server frontend:8080 max_fails=3 fail_timeout=30s;
  keepalive 16;
}

server {
  listen 80;
  server_name bi.example.com;
  # ACME challenge + HTTP->HTTPS redirect (cert-manager or compose certs).
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name bi.example.com;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;

  client_max_body_size 100m;

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /health { proxy_pass http://api; access_log off; }

  location /auth/ {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    proxy_pass http://frontend;
    proxy_cache static;
    proxy_cache_valid 200 10m;
    proxy_set_header Host $host;
    # SPA fallback is served by the frontend container itself.
  }
}

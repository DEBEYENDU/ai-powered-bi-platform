# Static frontend server (used inside the frontend container).
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /healthz { access_log off; return 200 'ok'; }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
